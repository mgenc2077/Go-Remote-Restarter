name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Build Linux amd64
        run: GOOS=linux GOARCH=amd64 go build -ldflags="-w -s" -o remote-restarter-linux-amd64 .

      - name: Build Windows amd64
        run: GOOS=windows GOARCH=amd64 go build -ldflags="-w -s" -o remote-restarter-windows-amd64.exe .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: |
            remote-restarter-linux-amd64
            remote-restarter-windows-amd64.exe
